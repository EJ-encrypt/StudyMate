# Supabase pauses a free project after about a week with no activity, and the
# app is down until someone restores it from the dashboard. This asks the live
# API to touch the database once a day, which counts as activity.
name: Keep alive

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the API to reach the database
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 "https://studymate-alpha-fawn.vercel.app/api/health?deep=1"

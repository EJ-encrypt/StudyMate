# Local development only: a Postgres to run the backend and its tests against.
# Production runs on Vercel + Supabase (see docs/deployment.md).
#
#   docker compose up -d
#
# then DATABASE_URL=postgresql+psycopg2://studymate:studymate@localhost:5432/studymate

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studymate
      POSTGRES_PASSWORD: studymate
      POSTGRES_DB: studymate
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studymate"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
